---
layout: compress
---

{% include base_path %}

<!doctype html>
<html lang="{{ site.locale | slice: 0,2 }}" class="no-js">
  <head>
    {% include head.html %}
    {% include head/custom.html %}
  </head>

  <body>

    {% include browser-upgrade.html %}
    {% include masthead.html %}

    {{ content }}

    <div class="page__footer">
      <footer>
        {% include footer/custom.html %}
        {% include footer.html %}
      </footer>
    </div>
    <!-- ✅ كود البوت الجديد -->
    <div id="chat-launcher" onclick="toggleChat()" style="position: fixed; bottom: 20px; right: 20px; background-color: #444; color: white; padding: 10px 15px; border-radius: 25px; cursor: pointer; z-index: 9999;">
      Chat with me 💬
    </div>

    <div id="chat-popup" style="display:none; position: fixed; bottom: 80px; right: 20px; width: 300px; background: white; border: 1px solid #ccc; border-radius: 10px; padding: 10px; z-index: 9999;">
      <div style="font-weight: bold;">Ask me anything 👇</div>
      <div id="chat-log" style="height: 150px; overflow-y: auto; border: 1px solid #eee; margin-top: 10px; padding: 5px; font-size: 14px;"></div>
      <input type="text" id="chat-input" placeholder="Type your question..." style="width: 100%; margin-top: 10px;" />
      <button onclick="sendChat()" style="width: 100%; margin-top: 5px;">Send</button>
    </div>

    <script>
      function toggleChat() {
        const popup = document.getElementById('chat-popup');
        popup.style.display = popup.style.display === 'none' ? 'block' : 'none';
      }

      async function sendChat() {
        const input = document.getElementById("chat-input").value;
        const log = document.getElementById("chat-log");
        if (!input.trim()) return;

        log.innerHTML += `<div><strong>You:</strong> ${input}</div>`;

        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: input })
        });

        const data = await response.json();
        const botReply = data.reply || "ما قدرت أجاوب على هذا السؤال.";

        log.innerHTML += `<div><strong>Bot:</strong> ${botReply}</div>`;
        document.getElementById("chat-input").value = "";
        log.scrollTop = log.scrollHeight;
      }
    </script>

    <!-- ⬇️ سكربتات القالب -->
    
    {% include scripts.html %}

  </body>
</html>
